<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-label="William Wallace, Solutions Architect and Full-Stack Builder">
  <title>William Wallace, Solutions Architect</title>

  <defs>
    <style>
      .void   { fill: #09090b; }
      .grid   { stroke: #00f0ff; stroke-width: 1; opacity: 0; }
      .mark   { stroke: #00f0ff; stroke-width: 1.5; fill: none; opacity: 0; }
      .rule   { stroke: #00f0ff; stroke-width: 2; stroke-dasharray: 320; stroke-dashoffset: 320; }
      .name   { font-family: Georgia, 'Times New Roman', serif; font-size: 76px; fill: #f8fafc; letter-spacing: 1px; opacity: 0; }
      .eyebrow{ font-family: ui-monospace, 'SF Mono', SFMono-Regular, Consolas, monospace; font-size: 15px; fill: #00f0ff; letter-spacing: 6.5px; opacity: 0; }
      .thesis { font-family: Georgia, 'Times New Roman', serif; font-size: 21px; fill: #94a3b8; font-style: italic; opacity: 0; }
      .block  { font-family: ui-monospace, 'SF Mono', SFMono-Regular, Consolas, monospace; font-size: 12px; fill: #475569; letter-spacing: 2px; opacity: 0; }
      .blockv { font-family: ui-monospace, 'SF Mono', SFMono-Regular, Consolas, monospace; font-size: 12px; fill: #94a3b8; letter-spacing: 2px; opacity: 0; }
      .tbrule { stroke: #1e293b; stroke-width: 1; opacity: 0; }

      @keyframes fadeGrid { to { opacity: 0.07; } }
      @keyframes fadeMark { to { opacity: 0.55; } }
      @keyframes draw     { to { stroke-dashoffset: 0; } }
      @keyframes rise     { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes riseDim  { from { opacity: 0; transform: translateY(8px); } to { opacity: 0.75; transform: translateY(0); } }
      @keyframes fadeRule { to { opacity: 1; } }

      .grid    { animation: fadeGrid 1.1s ease-out 0.05s forwards; }
      .mark    { animation: fadeMark 0.7s ease-out 0.9s forwards; }
      .eyebrow { animation: rise 0.7s cubic-bezier(.16,1,.3,1) 0.35s forwards; }
      .name    { animation: rise 0.9s cubic-bezier(.16,1,.3,1) 0.55s forwards; }
      .rule    { animation: draw 1s cubic-bezier(.16,1,.3,1) 1.0s forwards; }
      .thesis  { animation: rise 0.8s cubic-bezier(.16,1,.3,1) 1.15s forwards; }
      .tbrule  { animation: fadeRule 0.6s ease-out 1.3s forwards; }
      .block   { animation: riseDim 0.6s ease-out 1.4s forwards; }
      .blockv  { animation: rise 0.6s ease-out 1.45s forwards; }

      @media (prefers-reduced-motion: reduce) {
        .grid { animation: none; opacity: 0.07; }
        .mark { animation: none; opacity: 0.55; }
        .rule { animation: none; stroke-dashoffset: 0; }
        .name, .eyebrow, .thesis, .blockv { animation: none; opacity: 1; }
        .block { animation: none; opacity: 0.75; }
        .tbrule { animation: none; opacity: 1; }
      }
    </style>
  </defs>

  <rect class="void" width="1200" height="380" />

  <!-- Blueprint grid -->
  <g class="grid">
    <path d="M40 0V380M80 0V380M120 0V380M160 0V380M200 0V380M240 0V380M280 0V380M320 0V380M360 0V380M400 0V380M440 0V380M480 0V380M520 0V380M560 0V380M600 0V380M640 0V380M680 0V380M720 0V380M760 0V380M800 0V380M840 0V380M880 0V380M920 0V380M960 0V380M1000 0V380M1040 0V380M1080 0V380M1120 0V380M1160 0V380" />
    <path d="M0 40H1200M0 80H1200M0 120H1200M0 160H1200M0 200H1200M0 240H1200M0 280H1200M0 320H1200M0 360H1200" />
  </g>

  <!-- Registration marks: technical-drawing corner brackets -->
  <g class="mark">
    <path d="M40 68V40H68" />
    <path d="M1132 40H1160V68" />
    <path d="M40 312V340H68" />
    <path d="M1160 312V340H1132" />
  </g>

  <!-- Content -->
  <text class="eyebrow" x="96" y="128">SOLUTIONS ARCHITECT</text>
  <text class="name" x="94" y="206">William Wallace</text>
  <line class="rule" x1="96" y1="240" x2="416" y2="240" />
  <text class="thesis" x="96" y="286">I dig into hard problems, weigh the alternatives,</text>
  <text class="thesis" x="96" y="314">and ship what wins on performance and cost.</text>

  <!-- Title block, as on an engineering drawing -->
  <g>
    <line class="tbrule" x1="880" y1="196" x2="1120" y2="196" />
    <line class="tbrule" x1="880" y1="238" x2="1120" y2="238" />
    <line class="tbrule" x1="880" y1="280" x2="1120" y2="280" />
    <text class="block"  x="880" y="222">DISCIPLINE</text>
    <text class="blockv" x="1120" y="222" text-anchor="end">FULL-STACK</text>
    <text class="block"  x="880" y="264">SHIPPED</text>
    <text class="blockv" x="1120" y="264" text-anchor="end">WEB · NATIVE</text>
    <text class="block"  x="880" y="306">BASED</text>
    <text class="blockv" x="1120" y="306" text-anchor="end">OLYMPIA, WA</text>
  </g>
</svg>
